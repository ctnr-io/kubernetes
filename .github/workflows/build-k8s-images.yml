name: Build Kubernetes Images

# This workflow builds provider-independent Ubuntu images with the chosen
# Kubernetes distribution (kubeadm, k3s, k0s) plus multiple container runtimes
# (runc, gvisor/runsc, kata-containers, wasmtime, wasmedge), Longhorn/Rook-Ceph
# storage prerequisites, and etcd backup scripts pre-installed.
#
# Build strategy (no KVM required):
#   1. Build .github/images/Dockerfile with the selected distro and runtimes
#   2. Convert the container image directly to a bootable qcow2 using d2vm
#   3. Enforce a sparse image artifact smaller than 2 GiB
#   4. Publish to GitHub Releases
#   5. Smoke-test the image by mounting it and verifying installed binaries
#
# Images are published per (K8s minor version × distribution) combination.

on:
  push:
    branches:
      - main
      - copilot/create-dynamic-contabo-images
    paths:
      - '.github/images/**'
      - '.github/workflows/build-k8s-images.yml'
  workflow_dispatch:
    inputs:
      kubernetes_versions:
        description: >
          Override the Kubernetes minor versions to build (space-separated, max 5,
          e.g. "v1.29 v1.30 v1.31 v1.32 v1.33"). Leave blank to auto-detect
          the latest 5 stable minors.
        required: false
        default: ''
      distros:
        description: >
          Override the distributions to build (space-separated, e.g.
          "kubeadm k3s k0s"). Defaults to all three.
        required: false
        default: ''
      ubuntu_version:
        description: >
          Override the Ubuntu base image version (e.g. 22.04, 24.04). Leave blank
          to automatically use the latest Ubuntu LTS release.
        required: false
        default: ''
  schedule:
    # Rebuild on the 1st of every month to pick up package updates
    - cron: '0 0 1 * *'

# Only one run per ref at a time to avoid uploading conflicting release assets
concurrency:
  group: build-k8s-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # 1. Build the dynamic matrix from workflow inputs
  # ──────────────────────────────────────────────
  setup-matrix:
    name: Setup build matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      ubuntu_version: ${{ steps.detect-ubuntu.outputs.ubuntu_version }}
      kata_version: ${{ steps.set-matrix.outputs.kata_version }}
      wasm_version: ${{ steps.set-matrix.outputs.wasm_version }}

    steps:
      - name: Detect Ubuntu LTS version
        id: detect-ubuntu
        env:
          UBUNTU_VERSION_OVERRIDE: ${{ github.event.inputs.ubuntu_version }}
        run: |
          set -euo pipefail
          UBUNTU_VERSION="${UBUNTU_VERSION_OVERRIDE:-$(
            curl -fsSL https://cloud-images.ubuntu.com/releases/ 2>/dev/null \
              | grep -oE 'href="[0-9]+\.[0-9]+/' \
              | grep -oE '[0-9]+\.[0-9]+' \
              | awk -F'.' '$2 == "04" && ($1 % 2) == 0' \
              | sort -V \
              | tail -1
          )}"
          UBUNTU_VERSION="${UBUNTU_VERSION:-24.04}"
          echo "ubuntu_version=${UBUNTU_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using Ubuntu version: ${UBUNTU_VERSION}"

      - name: Resolve stable build matrix
        id: set-matrix
        env:
          GH_TOKEN: ${{ github.token }}
          K8S_VERSIONS_OVERRIDE: ${{ github.event.inputs.kubernetes_versions }}
          DISTROS_OVERRIDE: ${{ github.event.inputs.distros }}
        run: |
          set -euo pipefail

          MAX_VERSIONS=5

          normalize_lines() {
            tr ' ' '\n' <<< "${1:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | awk 'NF'
          }

          unique_preserve_order() {
            awk '!seen[$0]++'
          }

          github_release_tags() {
            local repo="$1"
            curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/${repo}/releases?per_page=100" \
              | jq -r '.[] | select(.draft | not) | select(.prerelease | not) | .tag_name'
          }

          latest_k8s_minors() {
            local stable major minor start
            stable="$(curl -fsSL https://dl.k8s.io/release/stable.txt)"
            major="$(sed -E 's/^v([0-9]+)\..*/\1/' <<< "${stable}")"
            minor="$(sed -E 's/^v[0-9]+\.([0-9]+).*/\1/' <<< "${stable}")"
            start=$((minor - MAX_VERSIONS + 1))
            seq "${start}" "${minor}" | awk -v major="${major}" '{printf "v%s.%s\n", major, $1}'
          }

          latest_github_tag_for_minor() {
            local repo="$1"
            local minor="$2"
            local suffix_regex="$3"
            github_release_tags "${repo}" \
              | grep -E "^${minor//./\\.}\\.[0-9]+${suffix_regex}$" \
              | sort -V \
              | tail -1
          }

          resolve_distro_version() {
            local distro="$1"
            local minor="$2"
            case "${distro}" in
              kubeadm)
                curl -fsSL "https://dl.k8s.io/release/stable-${minor#v}.txt"
                ;;
              k3s)
                latest_github_tag_for_minor "k3s-io/k3s" "${minor}" '([+]k3s[0-9]+)?'
                ;;
              k0s)
                latest_github_tag_for_minor "k0sproject/k0s" "${minor}" '([+]k0s[.][0-9]+)?'
                ;;
              *)
                return 1
                ;;
            esac
          }

          mapfile -t DISTROS < <(
            if [ -n "${DISTROS_OVERRIDE}" ]; then
              normalize_lines "${DISTROS_OVERRIDE}"
            else
              printf '%s\n' kubeadm k3s k0s
            fi | unique_preserve_order
          )

          mapfile -t K8S_MINORS < <(
            if [ -n "${K8S_VERSIONS_OVERRIDE}" ]; then
              normalize_lines "${K8S_VERSIONS_OVERRIDE}"
            else
              latest_k8s_minors
            fi \
              | sed -E 's/^(v[0-9]+\.[0-9]+)\.[0-9]+$/\1/' \
              | unique_preserve_order \
              | tail -n "${MAX_VERSIONS}"
          )

          KATA_VERSION="$(github_release_tags "kata-containers/kata-containers" \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1)"

          WASM_VERSION="$(github_release_tags "containerd/runwasi" \
            | grep -E '^containerd-shim-wasmedge/v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -E 's@^containerd-shim-wasmedge/@@' \
            | sort -V \
            | tail -1)"

          [ -n "${KATA_VERSION}" ] || {
            echo "ERROR: failed to resolve latest Kata Containers release"
            exit 1
          }

          [ -n "${WASM_VERSION}" ] || {
            echo "ERROR: failed to resolve latest runwasi WasmEdge release"
            exit 1
          }

          MATRIX_FILE="$(mktemp)"
          : > "${MATRIX_FILE}"

          for minor in "${K8S_MINORS[@]}"; do
            for distro in "${DISTROS[@]}"; do
              distro_version="$(resolve_distro_version "${distro}" "${minor}" || true)"
              if [ -z "${distro_version}" ]; then
                echo "::warning::Skipping ${distro} ${minor}: no stable release found"
                continue
              fi

              jq -nc \
                --arg distro "${distro}" \
                --arg k8s_version "${minor}" \
                --arg distro_version "${distro_version}" \
                '{distro: $distro, k8s_version: $k8s_version, distro_version: $distro_version}' \
                >> "${MATRIX_FILE}"

              echo "Selected ${distro} ${minor} -> ${distro_version}"
            done
          done

          MATRIX="$(jq -sc '{include: .}' "${MATRIX_FILE}")"
          if [ "$(jq '.include | length' <<< "${MATRIX}")" -eq 0 ]; then
            echo "ERROR: no stable versions were resolved"
            exit 1
          fi

          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "kata_version=${KATA_VERSION}" >> "$GITHUB_OUTPUT"
          echo "wasm_version=${WASM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: ${MATRIX}"
          echo "Using Kata version: ${KATA_VERSION}"
          echo "Using WASM version: ${WASM_VERSION}"

  # ──────────────────────────────────────────────
  # 2. Build pre-installed image per (version, distro)
  # ──────────────────────────────────────────────
  build-image:
    name: "${{ matrix.distro }} ${{ matrix.k8s_version }} (${{ matrix.distro_version }})"
    needs: setup-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required for creating/updating GitHub Releases
      actions: read
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      fail-fast: true

    env:
      K8S_VERSION: ${{ matrix.k8s_version }}
      DISTRO: ${{ matrix.distro }}
      DISTRO_VERSION: ${{ matrix.distro_version }}
      UBUNTU_VERSION: ${{ needs.setup-matrix.outputs.ubuntu_version }}
      KATA_VERSION: ${{ needs.setup-matrix.outputs.kata_version }}
      WASM_VERSION: ${{ needs.setup-matrix.outputs.wasm_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Build tools ───────────────────────────────────────────────────────
      - name: Install build tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-utils curl

          ARCH="$(dpkg --print-architecture)"
          case "${ARCH}" in
            amd64|arm64) ;;
            *)
              echo "ERROR: unsupported architecture for d2vm: ${ARCH}"
              exit 1
              ;;
          esac

          D2VM_TAG="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            https://api.github.com/repos/linka-cloud/d2vm/releases/latest \
            | python3 -c 'import sys, json; print(json.load(sys.stdin)["tag_name"])')"
          D2VM_URL="https://github.com/linka-cloud/d2vm/releases/download/${D2VM_TAG}/d2vm_${D2VM_TAG}_linux_${ARCH}.tar.gz"

          echo "Installing d2vm ${D2VM_TAG} from ${D2VM_URL}"
          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TMP_DIR}"' EXIT
          curl --retry 3 --retry-all-errors --retry-delay 2 -fsSL \
            -o "${TMP_DIR}/d2vm.tar.gz" "${D2VM_URL}"
          tar -xzf "${TMP_DIR}/d2vm.tar.gz" -C "${TMP_DIR}"
          sudo install -m 0755 "${TMP_DIR}/d2vm" /usr/local/bin/d2vm
          d2vm --help > /dev/null

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/.github/images
          load: true
          tags: k8s-image:${{ matrix.distro }}-${{ matrix.k8s_version }}
          build-args: |
            K8S_VERSION=${{ matrix.k8s_version }}
            DISTRO=${{ matrix.distro }}
            DISTRO_VERSION=${{ matrix.distro_version }}
            UBUNTU_VERSION=${{ needs.setup-matrix.outputs.ubuntu_version }}
            KATA_VERSION=${{ needs.setup-matrix.outputs.kata_version }}
            WASM_VERSION=${{ needs.setup-matrix.outputs.wasm_version }}
          secrets: |
            github_token=${{ github.token }}
          cache-from: type=gha,scope=k8s-image-${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=k8s-image-${{ matrix.distro }}

      - name: Convert Docker image to qcow2 with d2vm
        run: |
          IMAGE_FILENAME="${DISTRO}-${K8S_VERSION}.qcow2"
          echo "Converting Docker image to bootable qcow2 with d2vm…"
          d2vm convert "k8s-image:${DISTRO}-${K8S_VERSION}" \
            -o "${GITHUB_WORKSPACE}/${IMAGE_FILENAME}" \
            --size 8G \
            --append-to-cmdline "console=ttyS0"

          docker rmi "k8s-image:${DISTRO}-${K8S_VERSION}" || true
          ls -lh "${GITHUB_WORKSPACE}/${IMAGE_FILENAME}"

          IMAGE_BYTES="$(stat -c%s "${GITHUB_WORKSPACE}/${IMAGE_FILENAME}")"
          MAX_BYTES=$((2 * 1024 * 1024 * 1024))
          if [ "${IMAGE_BYTES}" -ge "${MAX_BYTES}" ]; then
            echo "::error::Image too large: ${IMAGE_BYTES} bytes (must be < 2 GiB)"
            exit 1
          fi

          echo "IMAGE_FILENAME=${IMAGE_FILENAME}" >> "$GITHUB_ENV"

      - name: Publish image to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="k8s-images"

          # Create the release if it does not yet exist
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo  "$GITHUB_REPOSITORY" \
              --title "Pre-built Kubernetes images" \
              --notes "Provider-independent Ubuntu images with multiple K8s distributions and container runtimes." \
              --prerelease
          fi

          # Upload asset, overwriting any previous version for this combination
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${GITHUB_WORKSPACE}/${IMAGE_FILENAME}"

          IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${IMAGE_FILENAME}"
          echo "IMAGE_URL=${IMAGE_URL}" >> "$GITHUB_ENV"
          echo "Image published at: ${IMAGE_URL}"

      # ── Summary ───────────────────────────────────────────────────────────
      - name: Summary
        if: always()
        run: |
          {
            echo "### \`${IMAGE_FILENAME}\`"
            echo ""
            echo "| Property | Value |"
            echo "| --- | --- |"
            echo "| Distribution | \`${DISTRO}\` |"
            echo "| Kubernetes minor | \`${K8S_VERSION}\` |"
            echo "| Stable release | \`${DISTRO_VERSION}\` |"
            echo "| Ubuntu       | \`${UBUNTU_VERSION}\` |"
            echo "| Image URL    | ${IMAGE_URL:-N/A} |"
            echo ""
            echo "**Pre-installed runtimes:** runc, gvisor (runsc), kata-containers, wasmtime, wasmedge"
            echo ""
            echo "**Storage prerequisites:** lvm2, cryptsetup, open-iscsi, nfs-common (Longhorn + Rook/Ceph ready)"
            echo ""
            echo "**etcd tools:** backup + restore scripts pre-installed at /usr/local/bin/ (activate daily cron via cloud-init on control-plane nodes)"
          } >> "$GITHUB_STEP_SUMMARY"

  # ──────────────────────────────────────────────
  # 3. Smoke-test: mount the released image and verify installed software
  # ──────────────────────────────────────────────
  smoke-test:
    name: "Smoke test ${{ matrix.k8s_version }} / ${{ matrix.distro }} / ${{ matrix.distro_version }}"
    needs: [setup-matrix, build-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJson(needs.setup-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      K8S_VERSION: ${{ matrix.k8s_version }}
      DISTRO: ${{ matrix.distro }}
      DISTRO_VERSION: ${{ matrix.distro_version }}
      UBUNTU_VERSION: ${{ needs.setup-matrix.outputs.ubuntu_version }}

    steps:
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q qemu-utils

      - name: Download image from release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE_FILENAME="${DISTRO}-${K8S_VERSION}.qcow2"
          IMAGE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/k8s-images/${IMAGE_FILENAME}"
          echo "Downloading ${IMAGE_URL}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
               -H "Accept: application/octet-stream" \
               -L "${IMAGE_URL}" -o /tmp/test.qcow2
          qemu-img info /tmp/test.qcow2

      - name: Mount image and run smoke tests
        run: |
          sudo modprobe nbd max_part=8
          sudo qemu-nbd --connect=/dev/nbd0 /tmp/test.qcow2
          sleep 2
          sudo partprobe /dev/nbd0
          sleep 1

          ROOT_PART="$(sudo lsblk -nrpo NAME,FSTYPE /dev/nbd0 | awk '$2 == "ext4" || $2 == "xfs" { print $1; exit }')"
          if [ -z "${ROOT_PART}" ]; then
            echo "ERROR: unable to detect Linux root partition"
            sudo lsblk -f /dev/nbd0
            exit 1
          fi

          sudo mount "${ROOT_PART}" /mnt
          echo "Image mounted from ${ROOT_PART}. Running smoke tests for distro=${DISTRO} k8s=${K8S_VERSION}…"

          PASS=0
          FAIL=0
          check() {
            local desc="$1"; local cmd="$2"
            if eval "$cmd" > /dev/null 2>&1; then
              echo "  ✅ $desc"
              PASS=$((PASS+1))
            else
              echo "  ❌ $desc"
              FAIL=$((FAIL+1))
            fi
          }

          # ── Container runtimes ────────────────────────────────────────────
          check "containerd shim (runc)"          "test -f /mnt/usr/bin/containerd-shim-runc-v2 || test -f /mnt/usr/local/bin/containerd-shim-runc-v2 || find /mnt -name containerd-shim-runc-v2 | grep -q ."
          check "gvisor runsc"                    "find /mnt -name runsc -o -name containerd-shim-runsc-v1 | grep -q ."
          check "kata-containers shim"            "test -f /mnt/usr/local/bin/containerd-shim-kata-v2 || test -f /mnt/opt/kata/bin/containerd-shim-kata-v2"
          check "wasmtime or wasmedge shim"       "find /mnt/usr/local/bin -name 'containerd-shim-wasm*' | grep -q ."

          # ── Kubernetes distribution ───────────────────────────────────────
          case "${DISTRO}" in
            kubeadm)
              check "kubeadm binary"   "test -f /mnt/usr/bin/kubeadm"
              check "kubectl binary"   "test -f /mnt/usr/bin/kubectl"
              check "kubelet binary"   "test -f /mnt/usr/bin/kubelet"
              check "containerd.io"    "find /mnt -path '*/bin/containerd' | grep -q ."
              ;;
            k3s)
              check "k3s binary"       "test -f /mnt/usr/local/bin/k3s"
              ;;
            k0s)
              check "k0s binary"       "test -f /mnt/usr/local/bin/k0s"
              ;;
          esac

          # ── Storage prerequisites ─────────────────────────────────────────
          check "lvm2 (lvs)"          "test -f /mnt/sbin/lvs || find /mnt -name lvs | grep -q ."
          check "cryptsetup"          "find /mnt -name cryptsetup | grep -q ."
          check "iscsid"              "find /mnt -name iscsid | grep -q ."

          # ── etcd tools ────────────────────────────────────────────────────
          check "etcd-backup.sh"      "test -x /mnt/usr/local/bin/etcd-backup.sh"
          check "etcd-restore.sh"     "test -x /mnt/usr/local/bin/etcd-restore.sh"

          # ── Kernel config ─────────────────────────────────────────────────
          check "k8s modules-load.d"  "test -f /mnt/etc/modules-load.d/k8s.conf"
          check "k8s sysctl"          "test -f /mnt/etc/sysctl.d/k8s.conf"

          echo ""
          echo "Smoke test results: ${PASS} passed, ${FAIL} failed"
          [ "${FAIL}" -eq 0 ] || exit 1

      - name: Unmount image
        if: always()
        run: |
          set +e
          sudo umount /mnt 2>/dev/null || true
          sudo qemu-nbd --disconnect /dev/nbd0 2>/dev/null || true
